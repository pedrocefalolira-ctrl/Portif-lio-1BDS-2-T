<!DOCTYPE html> <!--indica a linguagem de programação a ser utilizada, nesse caso, o HTML; deve ser a primeira linha do projeto-->
<html lang="en"> <!--abertura do documento, todas as tags\codigos devem ser escritas nesse espaço.-->
<head>\\<!-- abertura da tag que define o cabecalho  do documento. O conteudo inserido nesse espaço não é visivel no navegador, mas contém instrucoes sobre seu conteudo e comportamento. Dentro dessa tag, podem ser inseridas folhas de estilo e script.-->
    <meta charset="UTF-8"><!-- especifica qual o conjunto de caracteres (characterser ou charset) será usado para renderizar o texto da página. o UTF-8 contém todos os caracteres dos padrões Unicode e ASCII, o mais utilizado em págginas da web.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portifolio</title> <!-- fechamento da tag do cabeçalho.\-->
</head><!-- fechamento da tag do cabeçalho.-->
<body><!-- abertura da tag, marcando o espaço no qual deve estar contido o conteúdo visual da página. As demais tags que representam texto, botões e outros, devem ser adicionadas nesse intervalo,--> 
    <!--um documento HTML é composto por tags que são escritas entre < >. As tags precisam ser abertas e fechadas, o que as diferenciam é que as tags de fechamento possuem uma \ antes do nome. Alguns códigos não precisam da <\> para fechamento, apenas da barra, como no caso da tag meta. Outro aspecto importante da linguagem é que ela é cas insensitive, ou seja, não leva em consideração a diferença entre letras oficiais e minúsculas, sendo assim, as tags podem ser escritas das duas maneiras.-->
<!--No HTML há seis níveis de cabeçalhos\títulos que podem ser usados por meio das tags h1, h2, h3, h4, h5 e h6, sendo o h1 o mais relevante e o h6 o menor\menos relevante.-->
<h1> Matemática </h1>
<h2> Grandeza </h2>
<h3> Unidades de medidas </h3>
<h4> </h4>
</body>
</html> <!--fechamento do documento.-->
