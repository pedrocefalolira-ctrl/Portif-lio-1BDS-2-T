<!DOCTYPE html> <!--indica a linguagem de programação a ser utilizada, nesse caso, o HTML; deve ser a primeira linha do projeto-->
<html lang="en"> <!--abertura do documento, todas as tags\codigos devem ser escritas nesse espaço.-->
<head>\\<!-- abertura da tag que define o cabecalho  do documento. O conteudo inserido nesse espaço não é visivel no navegador, mas contém instrucoes sobre seu conteudo e comportamento. Dentro dessa tag, podem ser inseridas folhas de estilo e script.-->
    <meta charset="UTF-8"><!-- especifica qual o conjunto de caracteres (characterser ou charset) será usado para renderizar o texto da página. o UTF-8 contém todos os caracteres dos padrões Unicode e ASCII, o mais utilizado em págginas da web.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head><!-- fechamento da tag do cabeçalho.-->
<body>
    
</body>
</html><!-- fechamento do documento.-->
